name: Build APK para GitHub Release

# Dispara ao criar uma tag v* (ex.: v1.0.0) ou manualmente informando a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag da release (ex.: v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Gerar APK do JanuPoints
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend-mobile/package-lock.json

      - name: Instalar dependências do app mobile
        working-directory: app/frontend-mobile
        run: npm ci

      - name: Instalar EAS CLI
        run: npm install --global eas-cli

      - name: Gerar APK no EAS Build
        working-directory: app/frontend-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json \
            --wait > build.json
          echo "build_url=$(jq -r '.[0].artifacts.buildUrl' build.json)" >> "$GITHUB_ENV"

      - name: Baixar o APK gerado
        run: curl -fsSL -o janupoints.apk "$build_url"

      - name: Determinar a tag da release
        id: release-tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          release_tag="${INPUT_TAG:-$REF_TAG}"
          if [[ ! "$release_tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Tag inválida: use v seguido de letras, números, pontos, hífens ou sublinhados."
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Anexar o APK à release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          files: janupoints.apk
