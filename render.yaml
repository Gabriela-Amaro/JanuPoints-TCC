# Publicação de demonstração: escolha os recursos Free, sem adicionar discos.
services:
  - type: web
    name: janupoints-api
    runtime: python
    plan: free
    region: virginia
    rootDir: app/backend
    buildCommand: bash scripts/build.sh
    startCommand: bash scripts/start.sh
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: janupoints-db
          property: connectionString
      - key: ALLOW_DEMO_DATA
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: USE_SUPABASE_STORAGE
        value: "true"
      - key: SUPABASE_STORAGE_BUCKET
        value: janupoints-media
      - key: SUPABASE_S3_ENDPOINT_URL
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
  - type: web
    name: janupoints-web
    runtime: static
    rootDir: app/frontend-web
    buildCommand: npm ci --include=dev && npm run build:render
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: VITE_API_HOST
        fromService:
          name: janupoints-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: janupoints-db
    plan: free
    region: virginia
    databaseName: janupoints
    user: janupoints
    ipAllowList: []
